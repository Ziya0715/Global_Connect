      <line x1="-36" y1="0" x2="-12" y2="0"/>
      <line x1="12" y1="0" x2="36" y2="0"/>
      <line x1="-25.5" y1="-25.5" x2="-8.5" y2="-8.5"/>
      <line x1="8.5" y1="8.5" x2="25.5" y2="25.5"/>
      <line x1="25.5" y1="-25.5" x2="8.5" y2="-8.5"/>
      <line x1="-8.5" y1="8.5" x2="-25.5" y2="25.5"/>
      <line x1="-13.8" y1="-33.2" x2="-4.6" y2="-11.1"/>
      <line x1="4.6" y1="11.1" x2="13.8" y2="33.2"/>
      <line x1="33.2" y1="-13.8" x2="11.1" y2="-4.6"/>
      <line x1="-11.1" y1="4.6" x2="-33.2" y2="13.8"/>
