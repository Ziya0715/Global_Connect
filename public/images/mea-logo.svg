      <line x1="11.1" y1="4.6" x2="33.2" y2="13.8"/>
      <line x1="-33.2" y1="13.8" x2="-11.1" y2="4.6"/>
      <line x1="11.1" y1="-4.6" x2="33.2" y2="-13.8"/>
